<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sketchbook</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>sketchbook</h1>
    <p class="sub">generative studies &amp; data flows</p>
  </header>
  <main id="gallery"></main>
  <script type="module">
    import sketches from '/gallery-data.json';
    const gallery = document.getElementById('gallery');
    if (sketches.length === 0) {
      gallery.innerHTML = '<p class="empty">No sketches yet.</p>';
    }
    for (const s of sketches) {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `/sketches/${s.slug}/`;
      card.innerHTML = `
        ${s.thumbnail ? `<img src="/sketches/${s.slug}/${s.thumbnail}" alt="" loading="lazy" />` : '<div class="thumb-placeholder"></div>'}
        <h2></h2>
        <p class="desc"></p>
        <p class="meta"></p>`;
      card.querySelector('h2').textContent = s.title;
      card.querySelector('.desc').textContent = s.description;
      card.querySelector('.meta').textContent = [s.date, ...s.tags].join(' · ');
      gallery.appendChild(card);
    }
  </script>
</body>
</html>
