<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hydra edge</title>
  <style>
    body { margin: 0; padding-bottom: 12rem; box-sizing: border-box; background: #0e0e11; color: #e8e6e0; font: 14px ui-monospace, monospace; display: grid; place-items: center; min-height: 100vh; }
    a.back { position: fixed; top: 1rem; left: 1rem; color: #8a877e; text-decoration: none; }
    /* Constrained in both axes, not just width: the editor panel is tall, and
       on a short viewport a width-only rule lets the square canvas run on past
       the fold and sit behind it. */
    canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 13rem); }
    #ui { position: fixed; bottom: 0.75rem; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100vw - 2rem); display: flex; flex-direction: column; gap: 0.4rem; background: #17171cdd; padding: 0.5rem 0.7rem; border-radius: 8px; }
    .row { display: flex; gap: 0.4rem; align-items: center; justify-content: center; flex-wrap: wrap; }
    button { background: #26262e; color: #e8e6e0; border: 1px solid #444; border-radius: 4px; padding: 0.3rem 0.55rem; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { border-color: #7fb3a3; }
    textarea { width: min(46rem, calc(100vw - 4rem)); height: 6.5rem; background: #0e0e11; color: #e8e6e0; border: 1px solid #333; border-radius: 4px; padding: 0.5rem; font: inherit; font-size: 12px; line-height: 1.5; resize: vertical; }
    #error { display: none; color: #e05252; font-size: 11px; max-width: 46rem; white-space: pre-wrap; }
    #hint { position: fixed; top: 1rem; right: 1rem; color: #8a877e; text-align: right; line-height: 1.5; font-size: 12px; }
  </style>
</head>
<body>
  <a class="back" href="/">← sketchbook</a>
  <div id="hint">
    ctrl/cmd + enter = run · sobelEdge · robertsEdge<br />
    laplacianEdge · dogEdge · card<br />
    (tex, spread, gain, res[, ratio])
  </div>
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="row">
      <button id="preset">preset</button>
      <button id="run">run ⌘⏎</button>
      <button id="save">png</button>
    </div>
    <div class="row"><textarea id="code" spellcheck="false"></textarea></div>
    <div id="error"></div>
  </div>
  <script type="module" src="./sketch.js"></script>
</body>
</html>
