<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>blueprint</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      /* Deep blueprint blue: a touch lighter where the light pools mid-screen,
         darkening toward the corners so the grid can glow against it. */
      background:
        radial-gradient(120% 90% at 50% 44%,
          #4f68da 0%, #3049cb 38%, #2136ba 68%, #1728a4 88%, #111f92 100%);
    }
    a.back { position: fixed; top: 1rem; left: 1rem; color: #cdd6ff; opacity: 0.75;
             font: 14px ui-monospace, monospace; text-decoration: none; z-index: 4; }
    #hint { position: fixed; bottom: 1rem; right: 1rem; z-index: 4; color: #cdd6ff; opacity: 0.55;
            font: 12px ui-monospace, monospace; line-height: 1.6; text-align: right; }
    #hint kbd { color: #ffffff; font: inherit; }
    body.bare a.back, body.bare #hint { display: none; }

    /* The weather layer: dappled light and shade, like sun through leaves,
       oversized so it can wander without ever showing an edge. Each patch is
       an ellipse stretched along the layer's x-axis; the whole layer is then
       rotated in sketch.js so every smear lies on the same diagonal. Softness
       lives in the gradient falloff — no blur filter, so Plash pays almost
       nothing to keep this on screen all day. */
    #streaks { position: fixed; inset: 0; overflow: hidden; }
    .streak { position: absolute; inset: -75%; will-change: transform; }
    /* The layer is 2.5x the viewport, so only positions near its middle are
       ever on screen — the dapple clusters between 28% and 72% on purpose. */
    .streak.light { background:
      radial-gradient(26% 8% at 50% 50%, rgba(240,246,255,0.32), transparent 70%),
      radial-gradient(30% 9% at 36% 34%, rgba(240,246,255,0.30), transparent 70%),
      radial-gradient(22% 7% at 64% 62%, rgba(240,246,255,0.26), transparent 70%),
      radial-gradient(16% 5% at 58% 40%, rgba(240,246,255,0.22), transparent 70%),
      radial-gradient(18% 6% at 40% 66%, rgba(235,242,255,0.20), transparent 70%),
      radial-gradient(14% 5% at 68% 30%, rgba(240,246,255,0.20), transparent 70%);
    }
    .streak.dark { background:
      radial-gradient(30% 10% at 32% 62%, rgba(10,16,110,0.50), transparent 70%),
      radial-gradient(26% 9% at 68% 38%, rgba(9,15,105,0.45), transparent 70%),
      radial-gradient(20% 7% at 46% 28%, rgba(10,15,100,0.40), transparent 70%),
      radial-gradient(22% 8% at 58% 72%, rgba(9,14,95,0.45), transparent 70%),
      radial-gradient(16% 6% at 30% 42%, rgba(10,16,105,0.35), transparent 70%),
      radial-gradient(28% 10% at 72% 58%, rgba(9,14,95,0.40), transparent 70%);
    }

    /* The real dapple: a low-res noise shader upscaled to the viewport. The
       CSS .streak layers above stay as the fallback when WebGL is missing. */
    #shade { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    body.gl .streak { display: none; }

    #geometry { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <a class="back" href="/">← sketchbook</a>
  <div id="streaks">
    <div class="streak dark"></div>
    <div class="streak light"></div>
  </div>
  <canvas id="shade"></canvas>
  <svg id="geometry"></svg>
  <div id="hint"><kbd>space</kbd> holds the light still<br />add <kbd>?bare</kbd> before pointing Plash at it</div>
  <script type="module" src="./sketch.js"></script>
</body>
</html>
